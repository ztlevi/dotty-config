model_provider = "amazon-bedrock"

[mcp_servers.builder-mcp]
command = "builder-mcp"
args = ["--include-tools", "*", "--exclude-tools", "SkillsTool,WorkspaceSearch,Delegate,ToolReactivationTool"]

[mcp_servers.builder-mcp.env]
TOOL_PERSONALIZATION_ENABLED = "false"
TOOL_PERSONALIZATION_MIN_EXECUTIONS = "0"
TOOL_PERSONALIZATION_ROLLOUT_PERCENTAGE = "100"
TOOL_PERSONALIZATION_TRAINING_DAYS = "0"

[mcp_servers.bunsho-mcp]
command = "bunsho-mcp"

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.local-chorus-mcp]
command = "local-chorus-mcp"

[mcp_servers.pippin-mcp]
command = "pippin-mcp-server"

[mcp_servers.software-builder-insights-prod-mcp]
command = "software-builder-insights-prod-mcp"

[mcp_servers.appsec-mcp]
command = "appsec-mcp"

[mcp_servers.aws-knowledge]
url = "https://knowledge-mcp.global.api.aws"

[mcp_servers.scuderia-control-plane-mcp]
command = "hyperpod-control-plane-mcp"

[mcp_servers.scuderia-resilience-mcp]
command = "hyperpod-resilience-mcp"

[mcp_servers.copy-pasta-mcp]
command = "copy-pasta-mcp"

[model_providers.amazon-bedrock.aws]
region = "us-east-1"

[model_providers.amazon-bedrock.aws.credential_export]
command = "$HOME/.toolbox/bin/codex"
args = ["amzn", "credential-process"]

[model_providers.amazon-bedrock-runtime.aws]
region = "us-east-1"

[model_providers.amazon-bedrock-runtime.aws.credential_export]
command = "$HOME/.toolbox/bin/codex"
args = ["amzn", "credential-process"]

[marketplaces.frontend-slides]
source_type = "git"
source = "https://github.com/zarazhangrui/frontend-slides.git"

[marketplaces.planning-with-files]
source_type = "git"
source = "https://github.com/OthmanAdi/planning-with-files.git"

[marketplaces.agent-toolkit-for-aws]
source_type = "git"
source = "https://github.com/aws/agent-toolkit-for-aws.git"

[marketplaces.aim]
source_type = "local"
source = "$HOME/.aim/plugins/codex"

[plugins."AmazonBuilderCoreAIAgents-core@aim"]
enabled = true

[plugins."AmazonBuilderCoreAIAgents-pipeline-assistant@aim"]
enabled = true

[plugins."frontend-slides@frontend-slides"]
enabled = true

[plugins."planning-with-files@planning-with-files"]
enabled = true

[plugins."aws-core@agent-toolkit-for-aws"]
enabled = true

[plugins."superpowers@openai-api-curated"]
enabled = true

[plugins."SageMakerPipelineAgent-all@aim"]
enabled = true

[plugins."AtlasAICapabilities-all@aim"]
enabled = true

[plugins."BuilderInsightsAgents-all@aim"]
enabled = true

[plugins."HyperPodAIAgents-all@aim"]
enabled = true

[plugins."MeshClawAICapabilities-all@aim"]
enabled = true

[plugins."MidwayClientSuiteIntegrationAgents-all@aim"]
enabled = true

[plugins."AmazonBuilderCoreAIAgents-runtime-configuration-assistant@aim"]
enabled = true

[plugins."ScuderiaControlPlaneAICapabilities-all@aim"]
enabled = true

[plugins."EdgeSwarm-all@aim"]
enabled = true

[plugins."HyperPodAICapabilities-all@aim"]
enabled = true

[plugins."AVMAIToolKit-all@aim"]
enabled = true
